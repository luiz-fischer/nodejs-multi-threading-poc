services:
  redis:
    image: redis:7.4-alpine
    container_name: node-worker-redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    cpus: 1
    mem_limit: 512m
    volumes:
      - bullmq-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  single-thread:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-worker-single-thread
    environment:
      NODE_ENV: production
      PORT: 3000
      HASH_ROUNDS: ${HASH_ROUNDS:-10}
      OTEL_SERVICE_NAME: node-worker-single-thread
      OTEL_CONSOLE_EXPORTER: 'false'
      LOG_FILE: /logs/server.ndjson
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    cpus: 4
    mem_limit: 512m
    volumes:
      - ./logs/single-thread:/logs
    ports:
      - '3011:3000'
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  worker-thread:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-worker-thread
    environment:
      NODE_ENV: production
      PORT: 3000
      HASH_ROUNDS: ${HASH_ROUNDS:-10}
      OTEL_SERVICE_NAME: node-worker-thread
      OTEL_CONSOLE_EXPORTER: 'false'
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-3}
      WORKER_MAX_QUEUE: ${WORKER_MAX_QUEUE:-64}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_PAYLOAD_DIRECTORY: /var/lib/hash-payloads
      LOG_FILE: /logs/server.ndjson
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    cpus: 4
    mem_limit: 512m
    volumes:
      - ./logs/worker-thread:/logs
      - bullmq-payloads:/var/lib/hash-payloads
    ports:
      - '3012:3000'
    restart: 'no'
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  piscina:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-worker-piscina
    environment:
      NODE_ENV: production
      PORT: 3000
      HASH_ROUNDS: ${HASH_ROUNDS:-10}
      OTEL_SERVICE_NAME: node-worker-piscina
      OTEL_CONSOLE_EXPORTER: 'false'
      PISCINA_MAX_THREADS: 5
      PISCINA_MAX_QUEUE: ${PISCINA_MAX_QUEUE:-64}
      LOG_FILE: /logs/server.ndjson
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    cpus: 4
    mem_limit: 512m
    volumes:
      - ./logs/piscina:/logs
    ports:
      - '3013:3000'
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

volumes:
  bullmq-data:
  bullmq-payloads:
